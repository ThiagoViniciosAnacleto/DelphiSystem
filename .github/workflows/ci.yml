name: Continuous Integration - Delphi System

on:
  push:
    branches: [ "main", "dev", "feature/setup-devops" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: delphi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-cov httpx fastapi pydantic sqlalchemy

    - name: Executar Bateria de Testes e Cobertura (V&V)
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/delphi_test
        SECRET_KEY: "chave_ficticia_para_ambiente_de_testes_automatizados" # <-- Adicione esta linha aqui
      run: |
        pytest backend/tests/ --cov=backend --cov-report=term-missing